<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<meta name="description" content="Recapitulate: a spaced-repetition revision register (1-3-7-15-30 days) for exam preparation.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📒%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Recapitulate – Revision Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Gelasio:wght@700&display=swap">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2328;--mute:#6b7076;--line:#e6e1d4;--acc:#2a5bd7;--ok:#1f8a4c;--warn:#c2410c;--hl:#fff3b0;--finbg:#fdeaea;--red:#c0262d;--wh:#1f2328;--sh:0 6px 20px rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#14151a;--card:#1e2027;--ink:#ecebe6;--mute:#9a9ca3;--line:#32343c;--acc:#5b87f5;--ok:#4cc27f;--warn:#ff9a62;--hl:#4a4217;--finbg:#3a1d20;--wh:#fff;--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
main{max-width:760px;margin:0 auto;padding:12px 14px 110px}
header{position:relative;text-align:center;padding:8px 52px 16px}
h1{margin:0;font:700 40px/1.15 Georgia,Gelasio,"Times New Roman",serif;letter-spacing:.5px;animation:up .6s ease both}
.tag{margin:4px 0 0;font-weight:400;font-size:15px;letter-spacing:.3px;color:var(--mute);animation:up .7s ease both}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:2px 0 4px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
button{position:relative;overflow:hidden;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,background .2s,opacity .2s}
@media(hover:hover){button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18)}}
button:active{transform:scale(.94);box-shadow:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.s{padding:6px 11px;font-size:13px}button.w{width:100%}
button.red{background:var(--red)}button.ro{background:transparent;color:var(--red);border:1px solid var(--line)}
.ib{width:40px;height:40px;padding:0;border-radius:12px;font-size:17px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.gear{position:absolute;right:0;top:10px}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.g .rp,.ib .rp,.fab .rp,.tabs button:not(.on) .rp{background:rgba(120,120,120,.25)}
@keyframes rp{to{transform:scale(1);opacity:0}}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px;position:sticky;top:8px;z-index:4;box-shadow:var(--sh)}
.tabs button{flex:1;background:transparent;color:var(--ink);padding:10px 6px;border-radius:12px}
.tabs button.on{background:var(--acc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 40%,transparent)}
.tabs i{display:none;font-style:normal;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:0 6px;margin-left:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.15}.stat span{font-size:12px;color:var(--mute)}
.stat.w b{color:var(--warn)}.stat.r b{color:var(--red)}.stat.g b{color:var(--ok)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;transition:box-shadow .25s}
.card:hover{box-shadow:var(--sh)}
.fin{background:var(--finbg);border-color:var(--red);border-left:5px solid var(--red)}
.hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.hd>div:first-child{min-width:0;flex:1}.hd .acts{display:flex;gap:6px}
.ttl{font-size:20px;line-height:1.35;margin-bottom:4px;overflow-wrap:anywhere}.ttl b{font-size:23px}
.ttl .sp{color:var(--mute);margin:0 9px;font-weight:400}.ttl .st{font-weight:400;color:var(--wh)}
.fin .ttl b{color:var(--red)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--red);color:#fff;margin-left:8px;vertical-align:middle}
.sub{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .5s ease;animation:grow .7s ease both}
.fin .bar i{background:var(--red)}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line);min-height:48px}
.step span{flex:1}.step small{color:var(--mute)}
.done{text-decoration:line-through;color:var(--mute)}
.step input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:0 0 32px;width:32px;height:32px;margin:0;padding:0;position:relative;cursor:pointer;border:2.5px solid var(--ink);border-radius:5px 8px 6px 9px/8px 5px 9px 6px;background:var(--card);box-shadow:2px 2px 0 var(--line);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .25s}
.step input[type=checkbox]:hover{transform:rotate(-4deg) scale(1.1)}
.step input[type=checkbox]:checked{background:var(--hl)}
.step input[type=checkbox]::after{content:"";position:absolute;left:9px;top:1px;width:9px;height:18px;border:solid #1d4ed8;border-width:0 4.5px 4.5px 0;border-radius:2px;transform:rotate(43deg) scale(0);transform-origin:bottom right}
.step input[type=checkbox]:checked::after{transform:rotate(43deg) scale(1)}
.step input.pop:checked::after{animation:ink .4s cubic-bezier(.3,1.6,.5,1)}
.step input.pop:checked{animation:bump .35s ease}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--hl);color:var(--ink);margin-left:6px;animation:pulse 1.8s ease-in-out infinite}
.chip.od{background:#f6c7c7;color:#7a1217}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.45 ui-monospace,monospace;animation:up .3s ease both}
.empty{color:var(--mute);text-align:center;padding:36px 12px}.empty b{display:block;font-size:34px;margin-bottom:6px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:-4px 0 6px}.ok{color:var(--ok)!important}.bad{color:var(--red)!important}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border-radius:50%;font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:5;background:var(--card);border:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(10,10,15,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;animation:fi .15s}
.mb{background:var(--card);border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .22s}
.mb.c{text-align:center;max-width:380px}.mb .ic{font-size:44px}
.mb h3{margin:0 0 12px;font:800 22px "Playfair Display",Georgia,serif}.mb.c h3{margin:6px 0}
.mb p{color:var(--mute);margin:6px 0 14px}
.mb .r2{display:flex;gap:8px}.mb .r2>*{flex:1}
.sec{border-top:1px solid var(--line);padding:14px 0 4px}.sec h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--ink);padding:8px}.seg button.on{background:var(--acc);color:#fff}
.sw{display:flex;gap:12px;margin-bottom:10px}
.sw button{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink);font-size:15px;margin:0 0 12px}
.tg select{width:auto;margin:0;padding:8px}
.tg input{-webkit-appearance:none;appearance:none;width:46px;height:26px;flex:none;border-radius:99px;background:var(--line);position:relative;margin:0;padding:0;cursor:pointer;border:0;transition:background .2s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked{background:var(--acc)}.tg input:checked::after{transform:translateX(20px)}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pl span{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 11px;font-size:13px}
.pl span button{width:22px;height:22px;padding:0;border-radius:50%;background:transparent;color:var(--mute);font-size:12px}
details{margin-top:12px}summary{cursor:pointer;color:var(--acc);font-size:14px}.mb textarea{font:12px ui-monospace,monospace;margin:8px 0 6px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hl);color:var(--ink);border-radius:10px;padding:8px 10px;margin:8px 0 4px;font-size:14px}
.tm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;margin:6px 0 10px;font-size:14px}.tm span{flex:1 1 180px}.tm button{white-space:nowrap;min-width:112px}
.warnb{background:var(--finbg);border:1px solid var(--red);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.toast.act{pointer-events:auto}.toast button{background:transparent;color:#8ab4ff;padding:2px 10px;margin-left:8px;border-radius:99px;font-size:14px}
.tip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ico{width:22px;height:22px;display:inline-block;vertical-align:middle;pointer-events:none;flex:none}
.fab .ico{width:34px;height:34px}
.big{width:64px;height:64px;display:block;margin:0 auto 8px}.mb .big{width:56px;height:56px}
.mb h3 .ico{width:28px;height:28px;margin-right:8px;vertical-align:-6px}.r2 button .ico{width:18px;height:18px;margin-right:6px;vertical-align:-4px}
.srch{position:relative}.srch .ico{position:absolute;left:12px;top:12px;width:20px;height:20px}.srch input{padding-left:42px}
.tip b{display:flex;align-items:center;gap:8px;margin-bottom:2px}.tip .ico{width:26px;height:26px}
.go{display:flex;align-items:center;justify-content:center;gap:10px}
.go .arw{flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
@media(hover:hover){.go:hover .arw{transform:translate(4px,-4px)}}
.go.fly{background:var(--ok);pointer-events:none;transition:background .3s}
.go.fly .arw{animation:fly .85s cubic-bezier(.55,-.35,.75,.9) forwards}
.go.fly .lbl{animation:pop .35s .3s both}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}22%{transform:translate(-6px,6px) scale(.8)}100%{transform:translate(70px,-70px) scale(1.25);opacity:0}}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:12;max-width:92vw;text-align:center;white-space:nowrap;display:flex;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.enter .card,.enter .stat,.enter .empty{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.enter .card:nth-child(2){animation-delay:.07s}.enter .card:nth-child(3){animation-delay:.14s}.enter .card:nth-child(n+4){animation-delay:.21s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes fi{from{opacity:0}}@keyframes pop{from{transform:scale(.92);opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}@keyframes grow{from{width:0}}@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes ink{0%{transform:rotate(43deg) scale(0)}60%{transform:rotate(43deg) scale(1.3)}100%{transform:rotate(43deg) scale(1)}}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(hover:none){button:hover{transform:none;box-shadow:none}.step input[type=checkbox]:hover{transform:none}}
@media(max-width:600px){
 main{padding:8px 10px 110px}header{padding:6px 48px 12px}h1{font-size:31px}.tag{font-size:14px}
 .tabs button{padding:11px 4px;font-size:14px}.card{padding:12px 11px}
 .ttl{font-size:17px}.ttl b{font-size:19px}.ttl .sp{margin:0 6px}
 .step{gap:10px;align-items:flex-start}.step span{font-size:14px}
 .step input[type=checkbox]{flex:0 0 30px;width:30px;height:30px}.step input[type=checkbox]::after{left:8px;top:0}
 .ov{align-items:flex-end;padding:0}.mb{max-width:none;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:slide .25s}
 .mb.c{max-width:none}
}
</style></head><body><main>
<header><h1>Recapitulate</h1><p class="tag">Retrieval builds retention</p><button class="ib gear" id="gear" aria-label="Settings" title="Settings">⚙️</button></header>
<nav class="tabs" id="tabs"><button data-t="due">Today<i id="cnt"></i></button><button data-t="all">Register</button><button data-t="add">+ New</button></nav>
<div class="warnb" id="warn" hidden></div>
<div id="view"></div></main>
<button class="fab" id="bkb" aria-label="Backup and Restore" title="Backup and Restore"></button>
<div id="modal"></div><div class="toast" id="toast"></div>
<script>
const STEPS=[[1,"Morning Warm-up & Rule Audit"],[3,"Active Recall & 5 Speed-Drill Questions"],[7,"Error Notebook & Core Formula Check"],[15,"Mixed PYQ Challenge"],[30,"Mastery Consolidation & Exam-Level Test"]];
const DEF=["Arithmetic","Advanced Mathematics","Arithmetic Foundation","Vocabulary","Grammar","English Comprehensive","GK-Polity","GK-History","GK-Economics","GK-Geography","GK-Science","Static-GK","General Awareness (GA)"];
const ACC=["","#7c3aed","#1f8a4c","#ea580c","#db2777","#0d9488"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
let T=iso(new Date());
const addD=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let E=load("recap_v1",[]);if(!Array.isArray(E))E=[];
let S=Object.assign({theme:"auto",acc:"",anim:true,showDone:true,sort:"new",subjects:DEF.slice(),feyn:true,traps:true,inter:true,hindi:true,blurt:true,why:false,palace:false,rate:true,tip:true},load("recap_set",{}));
E=E.filter(x=>x&&x.subject&&Array.isArray(x.done)).map(x=>({...x,id:String(x.id||uid()),subs:String(x.subs||""),date:/^\d{4}-\d\d-\d\d$/.test(x.date||"")?x.date:T,done:[0,1,2,3,4].map(i=>x.done[i]?1:0)}));
if(!Array.isArray(S.subjects))S.subjects=DEF.slice();
let NOSTORE=false;try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){NOSTORE=true}
if(NOSTORE){$("warn").hidden=false;$("warn").textContent="⚠ This browser is blocking storage, so entries will be lost when you close the page. Use the backup button to export your data."}
let LB="";try{LB=localStorage.getItem("recap_bk")||""}catch(e){}
let tab="due",open=null,lastTick="",animIn=true,q="",flt="all";
const save=()=>store("recap_v1",E),saveS=()=>store("recap_set",S);

function applyPrefs(){const d=document.documentElement,dark=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
 d.dataset.theme=dark?"dark":"light";d.dataset.motion=S.anim?"on":"off";
 S.acc?d.style.setProperty("--acc",S.acc):d.style.removeProperty("--acc");
 document.querySelector('meta[name=theme-color]').content=dark?"#14151a":"#f6f4ee"}
applyPrefs();{const mq=matchMedia("(prefers-color-scheme:dark)");mq.addEventListener?mq.addEventListener("change",applyPrefs):mq.addListener(applyPrefs)}

const fin=e=>e.done.every(Boolean)||diff(T,e.date)>=30;

const ic=(k,c)=>`<img class="${c||'ico'}" src="${IC[k]}" alt="" draggable="false">`;
const wk=e=>S.rate&&e.weak&&e.weak<=T;
const BO=[["blurt","Active recall first","Brain-dump from memory (2-min timer) before checking notes"],["feyn","Feynman check","Explain the rule in your own words"],["why","Why/How questions","Link new facts to what you already know"],["traps","Traps & common errors","Focus on frequent exam mistakes"],["inter","Interleaved quiz","Mix today's topic with older topics"],["hindi","Hindi mnemonic & visual anchor","Memory tricks and images in Hindi"],["palace","Memory palace","Place lists along a familiar route (great for GK)"],["rate","Self-rating after each revision","Rate your recall; weak topics return tomorrow"],["tip","Daily memory tip","One study tip on the Today tab"]];
const TIPS=["Test yourself before re-reading. Pulling an answer out of memory strengthens it far more than reading it again.","Sleep soon after studying. Sleep helps your brain lock in what you learned that day.","Spread it out. Short reviews over many days beat one long cramming session.","Mix topics in one session. It feels harder, but it trains you to pick the right method in the exam.","Explain it aloud as if teaching a friend. Where you get stuck is exactly what to revise.","Take a 5-minute break every 25 minutes of focused study.","Write every mistake in your error notebook and revisit it. Mistakes you review stop repeating.","Link a new fact to something you already know. Connections make memories stick.","Turn a list into a story, or place its items in a familiar room (memory palace).","A 10-minute walk can sharpen focus before a hard study block.","Study the hardest topic first, while your mind is freshest."];
const tipHTML=()=>S.tip?`<div class="tip"><b>${ic("bulb")} Memory tip</b>${TIPS[Math.floor(Date.parse(T)/864e5)%TIPS.length]}</div>`:"";
let TI;function timer(b){clearInterval(TI);let s=120;const tick=()=>{if(!document.body.contains(b)){clearInterval(TI);return}b.textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s--<=0){clearInterval(TI);b.textContent="Start 2:00 timer";toast("⏰ Time! Now compare with your notes")}};tick();TI=setInterval(tick,1000)}
let tt;const toast=(t,fn,lb)=>{const x=$("toast");x.textContent=t;x.classList.toggle("act",!!fn);
 if(fn){const b=document.createElement("button");b.textContent=lb||"Undo";b.onclick=()=>{clearTimeout(tt);x.classList.remove("show");fn()};x.appendChild(b)}
 x.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("show"),fn?6000:2200)};
let lastFocus=null;
const closeM=()=>{$("modal").innerHTML="";document.body.style.overflow="";if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true})};
function sheet(html,cls){if(!$("modal").firstChild)lastFocus=document.activeElement;$("toast").classList.remove("show");$("modal").innerHTML=`<div class="ov"><div class="mb ${cls||""}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;document.body.style.overflow="hidden";const ov=$("modal").firstChild;ov.onclick=e=>{if(e.target===ov)closeM()};ov.firstChild.focus({preventScroll:true});return ov}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM();
 if(e.key==="Tab"){const m=$("modal").querySelector(".mb");if(!m)return;const f=[...m.querySelectorAll("button,input,select,textarea,summary")].filter(x=>!x.disabled&&x.tabIndex>=0&&x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||document.activeElement===m)){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function rate(e,i){sheet(`<div class="ic">🧠</div><h3>How well did you recall it?</h3><p>Be honest. This tells Recapitulate what needs extra attention.</p><div class="r2 rt"><button class="ro" data-r="1">😕 Weak</button><button class="g" data-r="2">🙂 OK</button><button data-r="3">😎 Strong</button></div><button class="g s w" id="sk" style="margin-top:10px">Skip</button>`,"c");
 $("modal").querySelector(".rt").onclick=ev=>{const b=ev.target.closest("[data-r]");if(!b)return;const v=+b.dataset.r;e.conf=e.conf||[0,0,0,0,0];e.conf[i]=v;e.weak=v===1?addD(T,1):null;save();closeM();render();toast(v===1?"Marked weak. It comes back tomorrow 🔁":"Nice, logged ✔")};
 $("sk").onclick=closeM}

const prompt_=(e,i)=>{const [d,n]=STEPS[i],o=E.filter(x=>x.id!==e.id).slice(-2).map(x=>x.subject+" ("+x.subs+")").join("; ")||"any earlier topic of this subject",P=[];
 if(S.blurt)P.push("Active Recall First – before showing any notes, ask me to write everything I remember about this topic (2-minute brain dump), then correct my gaps.");
 if(S.feyn)P.push("Feynman Socratic Check – 1-2 targeted questions; ask me to explain a core rule in my own words (do not give the answer first).");
 if(S.why)P.push("Why/How Questions – 2 elaborative questions asking why each rule works and how it connects to something I already know.");
 if(S.traps)P.push("Traps & Common Errors – 2 frequent exam traps or calculation bottlenecks.");
 if(S.inter)P.push("Interleaved Micro-Quiz – 3 short exam-level questions mixing this topic with: "+o+".");
 if(S.hindi)P.push("Hindi Mnemonic & Visual Anchor – a concise Hindi mnemonic / root-word breakdown / visual anchor.");
 if(S.palace)P.push("Memory Palace – if this topic has a list or sequence, place each item along a familiar route (method of loci) with vivid images.");
 return "Act as Recapitulate, my revision coach for competitive exams (SSC).\nRevision session: +"+d+" day ("+n+").\nSubject: "+e.subject+"\nSub-topics: "+e.subs+"\nStudied on: "+e.date+"\n\nGive me, in this order:\n"+(P.length?P.map((t,k)=>String.fromCharCode(65+k)+") "+t).join("\n"):"A) A short revision summary and 5 practice questions.")};

function card(e,only){
 const dn=e.done.filter(Boolean).length,f=fin(e);
 let h=`<div class="card${f?" fin":""}"><div class="hd"><div><div class="ttl"><b>${esc(e.subject)}</b><span class="sp">|</span><span class="st">${esc(e.subs)}</span>${f?'<span class="badge">Completed</span>':""}</div><div class="sub">Studied: ${e.date} · Register created: ${e.created||e.date}</div></div><div class="acts"><button class="ib" data-edit="${e.id}" aria-label="Edit" title="Edit">${ic("pen")}</button><button class="ib" data-del="${e.id}" aria-label="Delete" title="Delete">${ic("tr")}</button></div></div><div class="bar"><i style="width:${dn*20}%"></i></div>`;
 if(wk(e))h+=`<div class="wk"><span>🔁 Weak spot: re-read your notes and recall it once more.</span><button class="s" data-wk="${e.id}">Done</button></div>`;
 STEPS.forEach(([d,n],i)=>{
  const due=addD(e.date,d),dd=diff(due,T);if(only&&(e.done[i]||dd>0))return;
  const tag=e.done[i]?(e.conf&&e.conf[i]===1?'<span class="chip od">weak</span>':""):dd<0?`<span class="chip od">${-dd}d overdue</span>`:dd===0?`<span class="chip">due today</span>`:`<small>in ${dd}d</small>`;
  h+=`<div class="step"><input type="checkbox" class="${lastTick===e.id+":"+i?"pop":""}" data-id="${e.id}" data-i="${i}" ${e.done[i]?"checked":""} aria-label="Mark +${d}d revision done"><span class="${e.done[i]?"done":""}"><b>+${d}d</b> ${n} <small>(${due})</small> ${tag}</span><button class="g s" data-rev="${e.id}:${i}">Session</button></div>`;
  if(open===e.id+":"+i)h+=`<div style="margin:6px 0">${S.blurt?'<div class="tm"><span>🧠 Blurt first: close your notes and write everything you remember.</span><button class="g s" data-tm="1">Start 2:00 timer</button></div>':""}<div class="sub" style="margin-bottom:6px">Copy this prompt into Claude for your revision session:</div><pre id="pr">${esc(prompt_(e,i))}</pre><button class="s" data-copy="1">Copy prompt</button></div>`});
 return h+"</div>"}

function badge(){const n=E.filter(e=>pend(e).length||wk(e)).length,c=$("cnt");c.textContent=n||"";c.style.display=n?"inline-block":"none"}
function fillList(){
 let l=E.filter(e=>tab==="due"?(pend(e).length||wk(e)):(S.showDone||!fin(e)));
 if(tab==="all"){const k=q.trim().toLowerCase();if(k)l=l.filter(e=>(e.subject+" "+e.subs).toLowerCase().includes(k));if(flt==="act")l=l.filter(e=>!fin(e));if(flt==="done")l=l.filter(fin)}
 const so=tab==="due"?"due":S.sort;
 l=[...l].sort((a,b)=>so==="due"?nextDue(a).localeCompare(nextDue(b)):so==="az"?a.subject.localeCompare(b.subject):0);
 if(so==="new")l.reverse();
 const emp=!E.length?`<div class="empty"><b>📒</b>Welcome! Log what you studied today and Recapitulate will schedule every revision for you.<br><br><button data-go="add">+ Create your first register</button></div>`:tab==="due"?`<div class="empty">${ic("conf","big")}You're all caught up. Nothing due today.</div>`:`<div class="empty"><b>📒</b>No registers match.</div>`;
 $("lst").innerHTML=l.length?l.map(e=>card(e,tab==="due")).join(""):emp}

function fields(e){e=e||{};const L=S.subjects.slice();if(e.subject&&!L.includes(e.subject))L.push(e.subject);
 return `<label>Subject</label><select id="fj">${L.map(x=>`<option ${x===e.subject?"selected":""}>${esc(x)}</option>`).join("")}<option value="__o">Other (type your own)…</option></select><input id="fo" placeholder="Type your subject" style="display:none"><label>Sub-topics</label><textarea id="fs" rows="2" placeholder="e.g. Discount, Successive discount">${esc(e.subs||"")}</textarea><label>Date studied (Day 1)</label><input id="fd" type="date" value="${e.date||T}"><div class="err" id="fe"></div>`}
function bindF(){$("fj").onchange=()=>{$("fo").style.display=$("fj").value==="__o"?"block":"none";$("fe").textContent=""};["fs","fd","fo"].forEach(id=>$(id).addEventListener("input",()=>$("fe").textContent=""))}
function readF(){$("fe").textContent="";const s=($("fj").value==="__o"?$("fo").value:$("fj").value).trim(),t=$("fs").value.trim();
 if(!s||!t){$("fe").textContent="Please choose a subject and add sub-topics.";return null}return{subject:s,subs:t,date:$("fd").value||T}}

const norm=t=>String(t).toLowerCase().replace(/[\s,;.]+/g," ").trim();
const dupe=(r,skip)=>E.find(x=>x.id!==skip&&norm(x.subject)===norm(r.subject)&&norm(x.subs)===norm(r.subs));
function dupeErr(d,btn){$("fe").textContent=`Already in your register: ${d.subject} | ${d.subs} (studied ${d.date}). Edit that one instead of repeating it.`;
 if(btn){btn.classList.remove("shake");void btn.offsetWidth;btn.classList.add("shake")}}
function render(){
 $("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));badge();
 const v=$("view");v.className=animIn?"enter":"";animIn=false;
 if(tab==="add"){v.innerHTML=`<div class="card"><h2>Log a study session</h2>${fields()}<button class="w go" id="go"><span class="lbl">Create register entry</span><svg class="arw" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></button></div>`;bindF();
  $("go").onclick=()=>{const b=$("go");if(b.classList.contains("fly"))return;const r=readF();if(!r)return;
   const d=dupe(r);if(d){dupeErr(d,b);return}
   E.push({id:uid(),...r,created:T,done:[0,0,0,0,0]});save();
   b.classList.add("fly");b.querySelector(".lbl").textContent="Created ✓";
   const wait=S.anim&&!matchMedia("(prefers-reduced-motion:reduce)").matches?1000:250;
   setTimeout(()=>{tab="all";animIn=true;toast("Register created ✔");render()},wait)};return}
 if(tab==="due"){const od=E.reduce((a,e)=>a+pend(e).filter(i=>diff(addD(e.date,STEPS[i][0]),T)<0).length,0),dt=E.reduce((a,e)=>a+pend(e).filter(i=>diff(addD(e.date,STEPS[i][0]),T)===0).length,0);
  v.innerHTML=`${tipHTML()}<div class="stats"><div class="stat w"><b>${dt}</b><span>Due today</span></div><div class="stat r"><b>${od}</b><span>Overdue</span></div><div class="stat g"><b>${E.filter(fin).length}</b><span>Completed</span></div></div><div id="lst"></div>`}
 else v.innerHTML=`<div class="srch">${ic("sr")}<input id="q" type="search" placeholder="Search subject or sub-topic" value="${esc(q)}"></div><div class="chips">${[["all","All"],["act","Active"],["done","Completed"]].map(([k,l])=>`<button data-f="${k}" class="${flt===k?"on":""}">${l}</button>`).join("")}</div><div id="lst"></div>`;
 fillList()}

$("tabs").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;tab=b.dataset.t;open=null;animIn=true;render();window.scrollTo({top:0,behavior:"smooth"})};
const view=$("view");
view.addEventListener("input",ev=>{if(ev.target.id==="q"){q=ev.target.value;fillList()}});
view.addEventListener("change",ev=>{const c=ev.target;if(c.type!=="checkbox")return;const e=E.find(x=>x.id===c.dataset.id);if(!e)return;
 const on=c.checked,ix=+c.dataset.i;e.done[ix]=on?1:0;lastTick=c.dataset.id+":"+ix;save();
 if(tab==="due")render();else{fillList();badge()}lastTick="";
 if(on&&S.rate)rate(e,ix)});
view.addEventListener("click",ev=>{const t=ev.target,g=a=>t.closest("["+a+"]");let b;
 if(b=g("data-f")){flt=b.dataset.f;view.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b));fillList()}
 else if(b=g("data-rev")){open=open===b.dataset.rev?null:b.dataset.rev;fillList()}
 else if(b=g("data-copy")){const x=$("pr").textContent;try{navigator.clipboard.writeText(x);b.textContent="Copied!"}catch(e){const r=document.createRange();r.selectNodeContents($("pr"));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent="Selected, press copy"}}
 else if(b=g("data-go")){tab=b.dataset.go;animIn=true;render()}
 else if(b=g("data-wk")){const e=E.find(x=>x.id===b.dataset.wk);if(e){e.weak=null;save();render();toast("Weak spot cleared ✔")}}
 else if(b=g("data-tm"))timer(b);
 else if(b=g("data-del"))delAsk(b.dataset.del);
 else if(b=g("data-edit"))edit(b.dataset.edit)});

function delAsk(id){const e=E.find(x=>x.id===id);
 sheet(`<div class="ic">⚠️</div><h3>Delete this register?</h3><p><b>${esc(e.subject)}</b> – ${esc(e.subs)}<br>All revision checkpoints and progress will be permanently lost. This cannot be undone.</p><div class="r2"><button class="g" id="no">Keep it</button><button class="red" id="yes">Yes, delete</button></div>`,"c");
 $("no").onclick=closeM;$("yes").onclick=()=>{const ix=E.findIndex(x=>x.id===id),del=E[ix];E.splice(ix,1);save();closeM();render();toast("Register deleted",()=>{E.splice(Math.min(ix,E.length),0,del);save();render();toast("Restored ✔")})}}
function edit(id){const e=E.find(x=>x.id===id);
 sheet(`<h3>Edit register</h3>${fields(e)}<div class="r2"><button class="g" id="no">Cancel</button><button id="sv">Save changes</button></div>`);bindF();
 $("no").onclick=closeM;$("sv").onclick=()=>{const r=readF();if(!r)return;const d=dupe(r,e.id);if(d){dupeErr(d,$("sv"));return}Object.assign(e,r);save();closeM();render();toast("Changes saved ✔")}}

/* ---- Backup & Restore ---- */
const payload=()=>JSON.stringify({app:"recapitulate",version:2,exported:new Date().toISOString(),entries:E},null,2);
async function dl(name,text){
 let d=null;try{d=window.claude&&await window.claude.use("downloads")}catch(e){}
 if(d){try{await d.save({filename:name,data:text});return"ok"}catch(e){return e&&e.code==="declined"?"declined":"fail"}}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return"ok"}catch(e){return"fail"}}
function imp(txt){txt=String(txt||"").replace(/^\uFEFF/,"").trim();if(!txt)return[0,"Nothing to import. Choose a file or paste the backup text."];
 let o;try{o=JSON.parse(txt)}catch(e){return[0,"That doesn't look like a valid backup file."]}
 const a=Array.isArray(o)?o:o&&(o.entries||o.data);if(!Array.isArray(a))return[0,"No entries found in this backup."];
 const key=x=>norm(x.subject)+"|"+norm(x.subs),dt=v=>/^\d{4}-\d\d-\d\d$/.test(v||"");let n=0,u=0,sk=0;
 a.forEach(x=>{if(!x||!x.subject||!x.subs){sk++;return}
  const date=dt(x.date)?x.date:dt(x.created)?x.created:T;
  const r={id:String(x.id||uid()),subject:String(x.subject),subs:String(x.subs),date,created:x.created||date,done:[0,1,2,3,4].map(i=>x.done&&x.done[i]?1:0)};
  if(Array.isArray(x.conf))r.conf=x.conf.slice(0,5);if(x.weak)r.weak=x.weak;
  const y=E.find(y=>y.id===r.id||key(y)===key(r));
  if(y){const d=y.done.map((v,i)=>v||r.done[i]?1:0);if(d.join()!==y.done.join()){y.done=d;u++}else sk++;return}
  E.push(r);n++});
 if(n||u){save();render()}
 const m=[n&&n+" added",u&&u+" updated",sk&&sk+" already here"].filter(Boolean).join(", ");
 return n||u?[1,"Import done: "+m+"."]:[0,"Nothing new: all "+a.length+" entr"+(a.length===1?"y is":"ies are")+" already in this browser."]}
function backup(){
 sheet(`<h3>${ic("bk")}Backup &amp; Restore</h3><p>${E.length} entr${E.length===1?"y":"ies"} saved in this browser. Last backup: ${LB||"none yet"}. Export a file to keep your data anywhere; import it on any device to restore.</p>
 <div class="r2"><button id="bex">⬇ Export backup</button><button id="bim" class="g">⬆ Import backup</button></div><input type="file" id="bfi" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1">
 <p id="bms" style="min-height:20px;margin:10px 0 0"></p>
 <details open><summary>Or paste backup text</summary><textarea id="bta" rows="4" placeholder="Paste your backup text here"></textarea><div class="r2"><button class="g s" id="bcp">Copy my backup text</button><button class="s" id="brs">Import pasted text</button></div></details>
 <button class="g w" id="bcl" style="margin-top:14px">Close</button>`);
 const ms=$("bms"),ta=$("bta"),say=(t,c)=>{ms.textContent=t;ms.className=c||""};
 $("bcl").onclick=closeM;
 $("bex").onclick=async()=>{if(!E.length){say("Nothing to export yet.","bad");return}
  const r=await dl("recapitulate-backup-"+T+".json",payload());
  if(r==="ok"){LB=T;try{localStorage.setItem("recap_bk",T)}catch(e){}say("Backup file ready ✔","ok")}
  else if(r==="declined")say("Download cancelled.");else say("Download blocked. Use 'Copy my backup text' below.","bad")};
 $("bim").onclick=()=>$("bfi").click();
 $("bfi").onchange=ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;say("Reading file…");const fr=new FileReader();fr.onload=()=>{const[ok,m]=imp(fr.result);say(m,ok?"ok":"bad")};fr.onerror=()=>say("Couldn't read that file.","bad");fr.readAsText(f)};
 $("bcp").onclick=()=>{try{navigator.clipboard.writeText(payload());say("Backup text copied. Paste it into a notes app or message to yourself.","ok")}catch(e){ta.value=payload();ta.select();say("Select all and copy this text manually.")}};
 $("brs").onclick=()=>{const[ok,m]=imp(ta.value);say(m,ok?"ok":"bad")}}
$("bkb").innerHTML=ic("bk");$("bkb").onclick=backup;

/* ---- Settings ---- */
function subList(){$("sbl").innerHTML=S.subjects.map((x,i)=>`<span>${esc(x)}<button data-rs="${i}" aria-label="Remove">✕</button></span>`).join("")||'<small class="sub">No subjects. Add one below.</small>'}
function settings(){
 const ov=sheet(`<h3>Settings</h3>
 <div class="sec"><h4>Appearance</h4><div class="seg">${["auto","light","dark"].map(t=>`<button data-th="${t}" class="${S.theme===t?"on":""}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
 <div class="sw">${ACC.map(c=>`<button data-ac="${c}" style="background:${c||"#2a5bd7"}" class="${S.acc===c?"on":""}" aria-label="Accent colour"></button>`).join("")}</div></div>
 <div class="sec"><h4>Preferences</h4>
 <label class="tg"><span>Animations</span><input type="checkbox" id="tan" ${S.anim?"checked":""}></label>
 <label class="tg"><span>Show completed registers</span><input type="checkbox" id="tsd" ${S.showDone?"checked":""}></label>
 <label class="tg"><span>Sort registers</span><select id="tso">${[["new","Newest first"],["due","Next revision due"],["az","Subject A–Z"]].map(([k,l])=>`<option value="${k}" ${S.sort===k?"selected":""}>${l}</option>`).join("")}</select></label></div>
 <div class="sec"><h4>Memory boosters</h4><p class="sub" style="margin:0 0 12px">Switch on the techniques you want in your revision sessions.</p>${BO.map(([k,t,d])=>`<label class="tg"><span>${t}<small class="sub" style="display:block">${d}</small></span><input type="checkbox" data-bo="${k}" ${S[k]?"checked":""}></label>`).join("")}</div>
 <div class="sec"><h4>Subjects</h4><div class="pl" id="sbl"></div><div class="r2"><input id="nsb" placeholder="Add a subject"><button id="asb" style="flex:0 0 auto;margin-bottom:10px">Add</button></div><button class="g s" id="rsb">Reset to default list</button></div>
 <div class="sec"><h4>Data</h4><div class="r2"><button class="g" id="sbk">${ic("bk")}Backup &amp; Restore</button><button class="ro" id="sdl">${ic("tr")}Delete all data</button></div></div>
 <button class="w" id="cl" style="margin-top:14px">Done</button>`);
 subList();
 const addSub=()=>{const v=$("nsb").value.trim();if(!v)return;if(!S.subjects.some(x=>x.toLowerCase()===v.toLowerCase()))S.subjects.push(v);$("nsb").value="";subList();saveS()};
 ov.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.th!=null){S.theme=b.dataset.th;ov.querySelectorAll("[data-th]").forEach(x=>x.classList.toggle("on",x===b));saveS();applyPrefs()}
  else if(b.dataset.ac!=null){S.acc=b.dataset.ac;ov.querySelectorAll("[data-ac]").forEach(x=>x.classList.toggle("on",x===b));saveS();applyPrefs()}
  else if(b.dataset.rs!=null){S.subjects.splice(+b.dataset.rs,1);subList();saveS()}
  else if(b.id==="asb")addSub();
  else if(b.id==="rsb"){S.subjects=DEF.slice();subList();saveS()}
  else if(b.id==="sbk")backup();else if(b.id==="cl")closeM();else if(b.id==="sdl")wipe()});
 $("nsb").onkeydown=e=>{if(e.key==="Enter")addSub()};
 ov.addEventListener("change",ev=>{const k=ev.target.dataset&&ev.target.dataset.bo;if(k){S[k]=ev.target.checked;saveS();render()}});
 $("tan").onchange=e=>{S.anim=e.target.checked;saveS();applyPrefs()};
 $("tsd").onchange=e=>{S.showDone=e.target.checked;saveS();render()};
 $("tso").onchange=e=>{S.sort=e.target.value;saveS();render()}}
function wipe(){sheet(`${ic("tr","big")}<h3>Delete all data?</h3><p>All ${E.length} register${E.length===1?"":"s"} will be permanently removed from this browser. Export a backup first if you might need them.</p><div class="r2"><button class="g" id="no">Cancel</button><button class="red" id="yes">Delete everything</button></div>`,"c");
 $("no").onclick=closeM;$("yes").onclick=()=>{E=[];save();closeM();render();toast("All data deleted")}}
$("gear").onclick=settings;

render();
document.addEventListener("visibilitychange",()=>{const n=iso(new Date());if(!document.hidden&&n!==T){T=n;render()}});
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const R=b.getBoundingClientRect(),d=Math.max(R.width,R.height)*2,x=document.createElement("span");x.className="rp";x.style.cssText=`width:${d}px;height:${d}px;left:${ev.clientX-R.left-d/2}px;top:${ev.clientY-R.top-d/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),600)});
</script></body></html>
